{% extends 'store/base.html' %}{% block content %}<div class="sectionhead"><div><p class="eyebrow">MYSTYLE COLLECTION</p><h1>{{ heading }}</h1><p class="muted">{{ products|length }} styles to explore</p></div><form method="get"><select name="sort" onchange="this.form.submit()"><option value="">Sort by</option><option value="low" {% if request.GET.sort == 'low' %}selected{% endif %}>Price: Low to high</option><option value="high" {% if request.GET.sort == 'high' %}selected{% endif %}>Price: High to low</option><option value="new" {% if request.GET.sort == 'new' %}selected{% endif %}>Newest</option></select></form></div><div class="products">{% for p in products %}{% include 'store/product_card.html' with p=p %}{% empty %}<p class="empty-state">No products found in this section yet.</p>{% endfor %}</div>{% endblock %}
